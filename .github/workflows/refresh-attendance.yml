name: Refresh attendance data

on:
  schedule:
    # GitHub scheduled workflows can be delayed; this is periodic polling, not instant monitoring.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: attendance-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Fetch latest attendance
        run: python scrape_attendance.py

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add attendance-data.json
          if git diff --cached --quiet; then
            echo "No attendance data changes."
          else
            git commit -m "Refresh published attendance data"
            git push
          fi
